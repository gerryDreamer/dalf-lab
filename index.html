<html lang="fr"><head><meta charset="utf-8">

<title>DALF Lab</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b7a82"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f6;--cd:#fff;--tx:#14302f;--mu:#587170;--ac:#0b7a82;--on:#fff;--ok:#237a4b;--okb:#dcf3e5;--ko:#b73a3a;--kob:#fae1e1;--ln:#cfdddc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1819;--cd:#162526;--tx:#e5f0ef;--mu:#93aaa9;--ac:#45c3c8;--on:#052224;--ok:#59c98a;--okb:#143a29;--ko:#ff8585;--kob:#432122;--ln:#2a3f40}}
:root[data-theme="dark"]{--bg:#0e1819;--cd:#162526;--tx:#e5f0ef;--mu:#93aaa9;--ac:#45c3c8;--on:#052224;--ok:#59c98a;--okb:#143a29;--ko:#ff8585;--kob:#432122;--ln:#2a3f40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.25;margin:0}
h1{font-size:1.7rem}h2{font-size:1.3rem;margin:14px 0 18px}h3{font-size:1.05rem}
.mu,small,em{color:var(--mu);font-style:normal}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.xp{font-weight:700;color:var(--ac);white-space:nowrap}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px;border:1.5px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;background:var(--cd);color:var(--tx);border:1.5px solid var(--ln);border-left:6px solid var(--ac);border-radius:6px;font:inherit;cursor:pointer}
.card span{color:var(--ac);font-weight:700;margin-top:4px}
.card2{background:var(--cd);border:1.5px solid var(--ln);border-radius:6px;padding:14px 12px;margin-bottom:14px}
.card2 small{display:block;margin:2px 4px 8px}.card2 h3{padding:0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 6px;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);font:inherit;font-size:.93rem;cursor:pointer}
.row em{display:block;font-size:.85rem}.row b{font-size:.82rem;color:var(--mu);white-space:nowrap}.row.v b{color:var(--ok)}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
.x{float:right;border:0;background:none;color:var(--mu);font-size:1.2rem;cursor:pointer}
.opts{display:grid;gap:10px}
.opt{padding:13px 14px;text-align:left;background:var(--cd);color:var(--tx);border:1.5px solid var(--ln);border-radius:10px;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.opt.good{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--kob);border-color:var(--ko)}
input{width:100%;padding:13px 14px;font:inherit;background:var(--cd);color:var(--tx);border:1.5px solid var(--ln);border-radius:10px}
.fb{margin:16px 0;padding:12px 14px;border-radius:10px}.fb.g{background:var(--okb);color:var(--ok)}.fb.b{background:var(--kob);color:var(--ko)}
.fb small{display:block;margin-top:4px;color:inherit}
.pri{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.end{text-align:center;padding-top:40px}
.note{margin-top:22px;font-size:.85rem;color:var(--mu)}
textarea{width:100%;min-height:150px;margin-top:6px;padding:12px 14px;font:inherit;background:var(--cd);color:var(--tx);border:1.5px solid var(--ln);border-radius:10px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.p{display:flex;gap:10px;padding:8px 6px;border-radius:6px;cursor:pointer;font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.p b{color:var(--mu);font:600 .8rem system-ui,sans-serif;min-width:28px;padding-top:4px}
.p.h{background:var(--ac);color:var(--on)}.p.h b{color:inherit}
.wc{font-weight:700;margin:8px 0 2px}.wc.in{color:var(--ok)}.wc.out{color:var(--ko)}
.sec{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;padding:8px 0;cursor:pointer}.sec:disabled{color:var(--mu);cursor:default}
nav button{padding:10px 2px;font-size:.88rem}
input[type=file]{margin:6px 0 14px}
.rs{margin:14px 0;padding:10px 12px;background:var(--cd);border:1.5px solid var(--ln);border-radius:10px}.rs summary{cursor:pointer;font-weight:600;color:var(--ac)}.rs p{margin:10px 0 0;font-size:.93rem}
.row .sec{padding:4px 0 4px 8px}
#im h3{margin:20px 0 6px}
select{width:100%;padding:13px 14px;margin-bottom:14px;font:inherit;background:var(--cd);color:var(--tx);border:1.5px solid var(--ln);border-radius:10px}
</style></head><body><main id="app"></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const L=[
{id:1,t:"Vocabulaire de la justice",s:"Cahier p. 17 (ex. 1 et 2), corrigé p. 222",q:[
["c","Dans le synopsis du film, quel synonyme de « punir » ?",["condamner","relaxer","acquitter","délibérer"],0],
["c","Synonyme de « agressions sexuelles »",["viols","fraudes","attentats","escroqueries"],0],
["c","Synonyme de « processus »",["dispositif","préjudice","réquisitoire","plainte"],0],

["c","Leur rôle est aussi de … (ex. 2)",["prévenir la récidive","obtenir réparation","plaider","délibérer"],0]]},
{id:2,t:"Le procès pénal en France",s:"Cahier p. 18 (ex. 4), corrigé p. 222",q:[
["c","Un délit est jugé devant le tribunal…",["de police","correctionnel","administratif"],1],
["c","Un crime est jugé devant la cour…",["d’assises","d’appel","de cassation"],0],

["c","Devant la cour d’assises, on parle d’…",["acquittement","non-lieu"],0]]},

["t","« Redevenir acteur de sa propre vie, c’est ce que propose la justice restaurative. »","Redevenir acteur de sa propre vie, c’est ce qui est proposé par la justice restaurative."],

["t","« Par la préparation, on avait créé un espace de parole sécurisé pour pouvoir échanger et avancer. »","Par la préparation, un espace de parole sécurisé avait été créé pour échanger et avancer."],

{id:4,t:"Participes passés des verbes pronominaux",s:"Cahier p. 19 (ex. 9), corrigé p. 222",q:[

["t","Quelques gardiens (se sentir pousser) des ailes.","se sont senti pousser"],
["t","Ils (se laisser dire) que ces mesures pouvaient avoir des effets bénéfiques.","s’étaient laissé dire / se sont laissé dire"],
["t","Certaines (se voir refuser) l’accès à l’atelier.","se sont vu refuser"],
["t","Les participants (se laisser surprendre) par les émotions.","se sont laissé surprendre"],
["t","Certains (se sentir renaître).","se sont sentis renaître"],
["t","Ils (s’entendre traiter) de privilégiés.","se sont entendu traiter"]]}
];
const LK=[
{h:"Piste audio 2 : l’équithérapie en prison",f:"Fichier editoc1_piste_02.mp3 reçu",r:[
["Livre p. 14, document C (questions 1 à 12)","icône d’écouteurs n° 2 et nom du fichier","Haute"],
["Transcription p. 198","intitulé « Page 14, C »","Haute"],
["Cahier ex. 10 (p. 20), corrigé p. 222","même sujet et même vocabulaire","Moyenne"]]},
{h:"Vidéo 1 : bande-annonce de « Je verrai toujours vos visages »",f:"Fichier vidéo non fourni",r:[
["Livre p. 12, document A (questions 1 à 10)","icône de clap n° 1","Haute"],
["Transcription vidéo p. 218","intitulé « Page 12, A »","Haute"],
["Cahier ex. 11 (p. 20-21), corrigé p. 222","consigne « Visionnez la bande-annonce »","Haute"]]},
{h:"Tribune « Vers un horizon d’apaisement »",f:"Texte du livre, p. 12-13 (lignes 1 à 119)",r:[
["Cahier ex. 7 (p. 18-19)","renvoi « tribune p. 12 » et numéros de ligne","Haute"],
["Cahier ex. 12 à 15, corrigé p. 222-223","plages de lignes (L. 9 à 14, etc.)","Haute"],
["Fiche méthodologique 2, p. 188","renvoi explicite dans le cahier","Haute"]]},
{h:"Vocabulaire et grammaire",f:"Livre p. 15 et p. 16",r:[
["Vocabulaire p. 15, cahier ex. 1 à 5","même thème, mots communs","Moyenne"],
["Grammaire p. 16, cahier ex. 6 à 9","renvoi « Cahier, p. 18 »","Haute"]]}
];
let S={xp:0,done:{},ok:{},txt:"",hl:{},w:{},m:{},res:[],gen:[],ai:null,xo:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("dalf1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("dalf1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$("#app");
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
function ok(u,a){const x=nz(u);return a.split(" / ").some(b=>{const y=nz(b);if(x===y)return true;const p=y.split(" "),q=x.split(" ");if(p.length<7)return false;const i=p.filter(w=>q.includes(w)).length;return 2*i/(p.length+q.length)>=.85})}
function home(t){t=t||"l";app.innerHTML=`<div class="hd"><div><h1>Édito C1, thème 1</h1><span class="mu">Justice, quelles alternatives ?</span></div><div class="xp">${S.xp} XP</div></div><nav><button class="${t=="l"?"on":""}" onclick="home('l')">Leçons</button><button class="${t=="t"?"on":""}" onclick="home('t')">Lire</button><button class="${t=="w"?"on":""}" onclick="home('w')">Écrire</button><button class="${t=="r"?"on":""}" onclick="home('r')">Liens</button><button class="${t=="i"?"on":""}" onclick="home('i')">Import</button></nav>`+(t=="l"?lessons():t=="t"?reader():t=="w"?writer():t=="i"?importer():t=="x"?extra():links())+`<p class="note">Prototype : tes résultats restent dans ce navigateur. La synchronisation Google Drive et l’API d’IA viendront dans l’appli complète.</p>`}
function lessons(){return lessons0()+xcard()}
const PV={gemini:{n:"Google Gemini",u:"",m:"gemini-flash-latest"},mistral:{n:"Mistral",u:"https://api.mistral.ai/v1",m:"mistral-small-latest"},groq:{n:"Groq",u:"https://api.groq.com/openai/v1",m:"llama-3.3-70b-versatile"},openrouter:{n:"OpenRouter",u:"https://openrouter.ai/api/v1",m:""},deepseek:{n:"DeepSeek",u:"https://api.deepseek.com",m:"deepseek-chat"},autre:{n:"Autre (compatible OpenAI)",u:"",m:""}};
const TP=["S’informer sur la justice restaurative","Argumenter sur la place de la médiation animale en prison","Choisir la voix active ou passive pour servir son propos","Vocabulaire de la justice (acteurs, faits, lieux, procédure pénale)"];
const KD={qcm:"Exercices (leçon jouable)",texte:"Texte de compréhension écrite avec questions",essai:"Sujets d’essai argumenté DALF",debat:"Jeu de rôle ou débat à préparer"};
let GR="",GS="";
function opn(){return L.every(l=>(S.done[l.id]||0)>=Math.ceil(l.q.length*.7))}
function xcard(){const ok=opn()||S.xo,g=S.gen.map((l,i)=>`<button class="card" onclick="startG(${i})"><b>${esc(l.t)}</b><small>${esc(l.s)}</small><span>${S.done[l.id]!=null?"Meilleur score : "+S.done[l.id]+"/"+l.q.length:"Commencer"}</span></button>`).join("");
return (g?`<h3 style="margin:18px 0 8px">Leçons générées par l’IA</h3>`+g:"")+`<button class="card" onclick="home('x')"><b>Études extra avec l’IA</b><small>${ok?"Crée des exercices et des textes à partir des sujets du manuel.":"Se débloque quand tu as réussi toutes les leçons du manuel (70 % ou plus)."}</small><span>${ok?"Ouvrir":"Voir"}</span></button>`}
function startG(i){cur=S.gen[i];qi=0;sc=0;show()}
async function ai(p){const c=S.ai||{};if(!c.key)throw new Error("ajoute d’abord ta clé API dans les réglages");
if(c.p=="gemini"){const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(c.m)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.key},body:JSON.stringify({contents:[{parts:[{text:p}]}]})}),j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);return j.candidates[0].content.parts.map(x=>x.text).join("")}
const r=await fetch(c.u.replace(/\/$/,"")+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+c.key},body:JSON.stringify({model:c.m,messages:[{role:"user",content:p}]})}),j=await r.json();if(!r.ok)throw new Error(j.error&&(j.error.message||j.error)||r.status);return j.choices[0].message.content}
function apc(v){$("#au").value=PV[v].u;$("#am").value=PV[v].m}
async function asv(){S.ai={p:$("#ap").value,u:$("#au").value.trim(),m:$("#am").value.trim(),key:$("#ak").value.trim()};save();const o=$("#at2");o.textContent="Test en cours…";
try{const r=await ai("Réponds uniquement par le mot OK.");o.textContent="Connexion réussie : "+r.slice(0,40)}catch(e){o.textContent="Échec : "+e.message+". Certains fournisseurs bloquent les appels depuis un navigateur ; essaie-en un autre."}}
function extra(){const c=S.ai||{p:"gemini",u:"",m:PV.gemini.m,key:""},b=`<button class="sec" onclick="home('l')">← Leçons</button>`;
if(!opn()&&!S.xo)return b+`<p class="mu">Cette partie se débloque quand tu as réussi toutes les leçons du manuel avec au moins 70 %. Elle sert à aller plus loin, une fois le contenu appris.</p><button class="pri" onclick="S.xo=1;save();home('x')">Ouvrir quand même</button>`;
return b+`<h2>Études extra avec l’IA</h2><details class="rs"${c.key?"":" open"}><summary>Réglages de l’IA</summary><p class="mu">Fournisseur</p><select id="ap" onchange="apc(this.value)">${Object.keys(PV).map(k=>`<option value="${k}" ${c.p==k?"selected":""}>${PV[k].n}</option>`).join("")}</select><p class="mu">Adresse de l’API (sauf Gemini)</p><input id="au" type="text" value="${esc(c.u||"")}"><p class="mu">Modèle (vérifie le nom actuel chez le fournisseur)</p><input id="am" type="text" value="${esc(c.m||"")}"><p class="mu">Clé API (reste sur cet appareil)</p><input id="ak" type="password" autocomplete="off" value="${esc(c.key||"")}"><button class="sec" onclick="asv()">Enregistrer et tester</button><div id="at2" class="mu"></div></details><p class="mu">Sujet du manuel</p><select id="gs">${TP.map(t=>`<option>${esc(t)}</option>`).join("")}</select><p class="mu">Ou ton propre sujet</p><input id="gf" type="text"><p class="mu">Type de contenu</p><select id="gk">${Object.keys(KD).map(k=>`<option value="${k}">${KD[k]}</option>`).join("")}</select><p class="mu">Niveau</p><select id="gn"><option>C1</option><option>C2</option></select><p class="mu">Nombre de questions (exercices)</p><select id="gq"><option>5</option><option>8</option><option>10</option></select><p class="mu"><label><input id="gc" type="checkbox" style="width:auto"> Utiliser comme contexte les ressources que j’ai ajoutées (leur texte sera envoyé au fournisseur d’IA)</label></p><button class="pri" onclick="gen()">Générer</button><div id="gout"></div>`}
async function gen(){const o=$("#gout"),k=$("#gk").value,s=$("#gf").value.trim()||$("#gs").value,n=$("#gn").value,nq=$("#gq").value,ctx=$("#gc").checked?S.res.map(r=>r.x).join("\n\n").slice(0,6000):"";
const base="Tu es professeur de français langue étrangère et tu prépares un étudiant au DALF "+n+". Sujet issu d’un manuel (thème « Justice, quelles alternatives ? ») : "+s+"."+(ctx?"\nVoici des extraits du manuel pour t’appuyer :\n"+ctx+"\n":"")+"\nÉcris en français correct et naturel, de niveau "+n+".";
const P={qcm:base+"\nCrée "+nq+" exercices variés de vocabulaire et de grammaire sur ce sujet : environ la moitié de QCM à 4 choix, le reste à réponse écrite courte. Réponds UNIQUEMENT par un tableau JSON, sans texte autour, de la forme [{\"k\":\"c\",\"p\":\"question\",\"o\":[\"a\",\"b\",\"c\",\"d\"],\"a\":0},{\"k\":\"t\",\"p\":\"consigne et phrase\",\"a\":\"réponse attendue\"}] où \"a\" est l’indice de la bonne réponse pour \"c\".",
texte:base+"\nRédige un texte de 250 mots environ (article ou tribune), puis 8 questions de compréhension écrite de type DALF, puis le corrigé.",
essai:base+"\nPropose 3 sujets d’essai argumenté de 250 mots (consigne type DALF), puis un plan détaillé pour le premier.",
debat:base+"\nPropose un jeu de rôle ou débat à deux : situation, rôle de chaque personne avec ses arguments, expressions utiles et connecteurs, et critères pour juger la prestation."}[k];
o.textContent="Génération en cours…";
try{const r=await ai(P);
if(k=="qcm"){const a=JSON.parse(r.replace(/```json|```/g,"").trim()),q2=a.map(x=>x.k=="c"&&Array.isArray(x.o)&&x.o[x.a]!==undefined?["c",x.p,x.o,x.a]:x.k=="t"&&x.a?["t",x.p,String(x.a)]:null).filter(Boolean);if(!q2.length)throw new Error("réponse inattendue de l’IA");S.gen.push({id:"g"+Date.now(),t:s,s:"Généré par l’IA, à vérifier",q:q2});save();o.innerHTML=`<p class="fb g">Leçon créée (${q2.length} questions). Elle apparaît aussi dans la liste des leçons.</p><button class="pri" onclick="startG(${S.gen.length-1})">Commencer</button>`}
else{GR=r;GS=s;o.innerHTML=`<p class="mu">Généré par l’IA, à vérifier.</p><div class="rs" style="white-space:pre-wrap">${esc(r)}</div><button class="sec" onclick="gk2(1)">Ouvrir dans « Lire »</button><br><button class="sec" onclick="gk2(0)">Enregistrer comme note</button>`}}
catch(e){o.textContent="Échec : "+(e instanceof SyntaxError?"la réponse de l’IA n’était pas au bon format, réessaie.":e.message)}}
function gk2(m){if(m){S.txt=GR;S.hl={};save();home("t")}else{S.res.push({t:"note",l:0,q:0,r:GS,x:GR,ia:1});save();alert("Note enregistrée dans « Ajouter à la main ».")}}
function lessons0(){return L.map((l,i)=>`<button class="card" onclick="start(${i})"><b>${l.t}</b><small>${l.s}</small><span>${S.done[l.id]!=null?"Meilleur score : "+S.done[l.id]+"/"+l.q.length:"Commencer"}</span></button>`).join("")}
function links(){return `<p class="mu">Liens détectés automatiquement. Touche une ligne pour la valider.</p>`+LK.map((c,i)=>`<section class="card2"><h3>${c.h}</h3><small>${c.f}</small>${c.r.map((r,j)=>{const k=i+"-"+j;return `<button class="row ${S.ok[k]?"v":""}" onclick="tg('${k}')"><span>${r[0]}<em>${r[1]}</em></span><b>${S.ok[k]?"✓ validé":"Confiance "+r[2].toLowerCase()}</b></button>`}).join("")}</section>`).join("")}
function tg(k){S.ok[k]=!S.ok[k];save();home("r")}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function reader(){const ps=S.txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
if(!ps.length)return `<p class="mu">Colle ici un texte de ton manuel, par exemple la tribune p. 12-13. Il reste sur ton appareil.</p><textarea id="tx" aria-label="Texte du manuel" placeholder="Colle le texte ici"></textarea><button class="pri" onclick="sv()">Enregistrer le texte</button>`;

async function fromPdf(){const f=$("#xf").files[0];if(!f)return;if(!window.pdfjsLib){alert("La lecture des PDF n’a pas pu se charger.");return}

async function runImp(){const out=$("#im"),pf=[...$("#fp").files],mf=[...$("#fm").files];
if(!pf.length){out.textContent="Choisis d’abord au moins un PDF.";return}

const c=await(await d.getPage(i)).getTextContent(),it=seg(c.items);
P.push({f:f.name,n:i,it,num:it.filter(s=>/^\d{1,2}$/.test(s))})}}}

function seg(I){const L=[];I.forEach(x=>{if(!x.str)return;const y=x.transform[5],h=Math.abs(x.transform[3])||10;let r=L.find(q=>Math.abs(q.y-y)<=h*.4);if(!r){r={y,a:[]};L.push(r)}r.a.push({s:x.str,x:x.transform[4],w:x.width,h})});
const out=[];L.sort((a,b)=>b.y-a.y).forEach(r=>{r.a.sort((p,q)=>p.x-q.x);let cur="",end=null,h=10;r.a.forEach(t=>{if(end!=null){const g=t.x-end;if(g>h*1.5){out.push(cur);cur=""}else if(g>h*.15&&!/\s$/.test(cur)&&!/^\s/.test(t.s))cur+=" "}cur+=t.s;end=t.x+t.w;h=t.h});out.push(cur)});
return out.map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean)}
function analyse(P,fl){const R={ent:[],cor:[],med:[]};
P.forEach(p=>{const z=p.it.map(nz),h=r=>z.some(s=>r.test(s));p.k=h(/\baudios?\b/)&&h(/\btranscriptions?\b/)?"audio":h(/\bvideos?\b/)&&h(/\btranscriptions?\b/)?"video":h(/^corriges?$/)||(h(/corriges/)&&p.it.filter(s=>/^Page\s+\d+,/.test(s)).length>1)?"corrige":"livre"});
P.forEach(p=>{
if(p.k=="corrige")p.it.forEach(s=>{const m=s.match(/^Page\s+(\d+),\s*(.+)$/);if(m)R.cor.push({page:+m[1],s:m[2],pdf:p.n})});
if(p.k=="audio"||p.k=="video"){const E=[];
p.it.forEach((s,j)=>{const m=s.match(/^Page\s+(\d+),\s*([A-Z])\b\s*(?:[–—-]\s*(.*))?$/);if(m)E.push({k:p.k,page:+m[1],doc:m[2],titre:(m[3]||p.it[j+1]||"").replace(/^[–—-]\s*/,"").trim(),pdf:p.n})});
const nums=p.num.slice(-E.length||p.num.length);
E.forEach((e,i)=>{e.ic=nums.length==E.length?+nums[i]:0;const b=P.find(q=>q.k=="livre"&&e.titre&&q.it.some(s=>nz(s).includes(nz(e.titre))));e.bk=b?b.n:0;R.ent.push(e)})}});
fl.forEach(name=>{const m=name.match(/(piste|audio|track)[ _-]*0*(\d+)/i),v=name.match(/vid[eé]o[ _-]*0*(\d+)/i),k=m?"audio":v?"video":/\.(mp4|webm|mov)$/i.test(name)?"video":"audio",n=m?+m[2]:v?+v[1]:0;
let src=/(^|[_ -])ca[_ -]/i.test(name)?"cahier":"livre",nn=n;if(PF&&PF.audio){const A=PF.audio;for(const [s,r] of [["livre",A.nom_fichier||A.nom_fichier_livre],["cahier",A.nom_fichier_cahier]]){const q=r&&name.match(new RegExp(r,"i"));if(q){src=s;nn=+q[1];break}}}R.med.push({name,k,n:nn,src,e:nn&&src=="livre"?R.ent.find(e=>e.k==k&&e.ic==nn):null})});
R.diag=D(P);return R}
function D(P){const f={};P.forEach(p=>{const d=f[p.f]=f[p.f]||{pages:0,avecTexte:0,types:{},extrait:[],lignesPage:[]};d.pages++;if(p.it.length){d.avecTexte++;if(!d.extrait.length)d.extrait=p.it.slice(0,10)}d.types[p.k]=(d.types[p.k]||0)+1;p.it.forEach(s=>{if(/^page\s*\d+/i.test(s)&&d.lignesPage.length<6)d.lignesPage.push(s)})});return f}
function comp(R){const a=R.ent.filter(e=>e.k=="audio").length,v=R.ent.filter(e=>e.k=="video").length,c=R.cor.length,sm=R.med.filter(m=>!m.e).length,

+(PF&&PF.transcriptions&&PF.transcriptions.remarque?`<p class="mu">Profil ${esc(PF.titre)} : ${esc(PF.transcriptions.remarque)}.</p>`:"")+((!a||!v||!c||sm)?`<p class="mu">Ce qui manque pourra être ajouté plus tard en important un autre PDF. Sinon, l’IA pourra le proposer (transcription à partir de l’audio, corrigés à partir des exercices), avec la mention « généré par IA, à vérifier ». Un corrigé du manuel passe toujours avant celui de l’IA.</p><button class="sec" disabled>Générer avec l’IA (appli complète)</button>`:"")}

+`<h3>Corrigés (${R.cor.length})</h3>`+R.cor.map(c=>`<div class="row"><span>Livre p. ${c.page} : ${esc(c.s)}<em>corrigé en page ${c.pdf} du PDF</em></span></div>`).join("")
+`<h3>Fichiers audio et vidéo</h3>`+(R.med.map(m=>`<div class="row"><span>${esc(m.name)}${m.src=="cahier"?" (cahier)":""}<em>${m.e?(m.k=="audio"?"audio":"vidéo")+" n° "+m.n+", transcription du livre p. "+m.e.page+" : "+esc(m.e.titre):m.src=="cahier"?"audio du cahier, à rattacher avec le PDF du cahier":"aucune transcription correspondante"}</em></span></div>`).join("")||`<p class="mu">Aucun fichier choisi.</p>`)
+`<h3>Données détectées (JSON)</h3><textarea readonly onclick="this.select()" aria-label="Données JSON">${esc(JSON.stringify(R))}</textarea>`}
function writer(){return TK.map(k=>`<section class="card2"><h3>${k.t}</h3><small>${k.s}</small><p>${k.c}</p><textarea id="w-${k.id}" aria-label="${k.t}" placeholder="Écris ton texte ici" oninput="wr('${k.id}')">${esc(S.w[k.id]||"")}</textarea><div id="i-${k.id}">${stats(k.id)}</div></section>`).join("")}
